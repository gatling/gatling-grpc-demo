name: Build

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JAVA_OPTS: "-Xmx4G"
      SBT_OPTS: "-Dsbt.ci=true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Set up sbt
        uses: sbt/setup-sbt@ecad189dd245444b9ae0a0cd5922fd938b88906f # v1.5.12

      - name: Build Java Maven
        working-directory: java/maven
        run: ./mvnw --batch-mode -Dstyle.color=always --no-transfer-progress test-compile

      - name: Build Java Gradle
        working-directory: java/gradle
        run: ./gradlew gatlingClasses

      - name: Build JavaScript
        working-directory: javascript
        run: |
          npm ci
          npm run format-check
          npm run build

      - name: Build Kotlin Maven
        working-directory: kotlin/maven
        run: ./mvnw --batch-mode -Dstyle.color=always --no-transfer-progress test-compile

      - name: Build Kotlin Gradle
        working-directory: kotlin/gradle
        run: ./gradlew gatlingClasses

      - name: Build Scala sbt
        working-directory: scala/sbt
        run: sbt Test/compile

      - name: Build server
        working-directory: server
        run: ./gradlew classes

      - name: Build TypeScript
        working-directory: typescript
        run: |
          npm ci
          npm run format-check
          npm run build
