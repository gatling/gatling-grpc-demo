name: Build

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      JAVA_OPTS: "-Xmx4G"
      SBT_OPTS: "-Dsbt.ci=true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Set up sbt
        uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1.5.8

      - name: Build Java Maven
        working-directory: java/maven
        run: ./mvnw --batch-mode -Dstyle.color=always --no-transfer-progress test-compile

      - name: Build Java Gradle
        working-directory: java/gradle
        run: ./gradlew gatlingClasses

      - name: Build JavaScript
        working-directory: javascript
        run: |
          npm ci
          npm run format-check
          npm run build

      - name: Build Kotlin Maven
        working-directory: kotlin/maven
        run: ./mvnw --batch-mode -Dstyle.color=always --no-transfer-progress test-compile

      - name: Build Kotlin Gradle
        working-directory: kotlin/gradle
        run: ./gradlew gatlingClasses

      - name: Build Scala sbt
        working-directory: scala/sbt
        run: sbt Test/compile

      - name: Build server
        working-directory: server
        run: ./gradlew classes

      - name: Build TypeScript
        working-directory: typescript
        run: |
          npm ci
          npm run format-check
          npm run build
